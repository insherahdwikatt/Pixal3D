name: ProductVerse photo prep tests

on:
  push:
    branches:
      - productverse/photo-prep-v1
  pull_request:
    paths:
      - 'productverse/**'
      - 'tests/test_productverse_prepare.py'
      - 'inference.py'
      - '.github/workflows/productverse-photo-prep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CPU-only test dependency
        run: python -m pip install 'Pillow==12.0.0'
      - name: Syntax check (no torch import)
        run: python -m py_compile inference.py productverse/prepare_input.py
      - name: Run photo-prep unit tests (no GPU, no model weights)
        run: python -m unittest discover -s tests -p 'test_productverse_prepare.py' -v
